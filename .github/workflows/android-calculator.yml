name: Build Android Calculator

on:
  workflow_dispatch:
  push:
    paths:
      - "android-calculator/**"
      - ".github/workflows/android-calculator.yml"
  pull_request:
    paths:
      - "android-calculator/**"
      - ".github/workflows/android-calculator.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-calculator

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: android-calculator/**/*.gradle*

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: minimal-calculator-apk
          path: android-calculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
