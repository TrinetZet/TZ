name: Publish ClientBridge Android release
on:
  push:
    branches: [master, feat/clientbridge-android]
    paths: ['clientbridge-android/distribution/**', '.github/workflows/clientbridge-android-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'build-tools;36.0.0'
      - name: Verify published bytes and signing certificate
        working-directory: clientbridge-android/distribution
        run: |
          sha256sum --check SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs ClientBridge-v1.0.0.apk
      - name: Enable hardware acceleration
        if: github.ref != 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install signed release offline
        if: github.ref != 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash clientbridge-android/scripts/release-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clientbridge-signed-release-installation
          path: clientbridge-android/release-evidence/
      - name: Publish APK
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=clientbridge-android-v1.0.0
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --title 'ClientBridge Android 1.0.0' --notes-file clientbridge-android/distribution/RELEASE.md
          gh release upload "$TAG" clientbridge-android/distribution/ClientBridge-v1.0.0.apk clientbridge-android/distribution/SHA256SUMS.txt clientbridge-android/distribution/RELEASE.md --clobber
