name: TaskCapture Android
on:
 push:
  branches: [feat/taskcapture-android]
  paths: ['taskcapture-android/**', '.github/workflows/taskcapture-android.yml']
 workflow_dispatch:
permissions:
 contents: read
jobs:
 apk:
  runs-on: ubuntu-latest
  timeout-minutes: 45
  steps:
   - uses: actions/checkout@v5
   - uses: actions/setup-java@v5
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
     with:
      packages: platform-tools
      log-accepted-android-sdk-licenses: false
   - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
   - name: Check committed build files
     run: python3 taskcapture-android/scripts/test-build-files.py
   - name: Prepare pinned local model and runtime
     run: python3 scripts/prepare-dependencies.py
     working-directory: taskcapture-android
   - name: Unit tests and arm64 APK
     run: ./gradlew --no-daemon --max-workers=2 testDebugUnitTest assembleDebug
     working-directory: taskcapture-android
   - name: Check optimized inference kernels
     run: python3 taskcapture-android/scripts/check-native-flags.py
   - name: Verify packaged offline APK
     working-directory: taskcapture-android
     run: |
      mkdir -p distribution
      cp app/build/outputs/apk/debug/app-debug.apk distribution/TaskCapture-0.1.0-arm64.apk
      python3 scripts/test-verification.py
      python3 scripts/verify-apk.py distribution/TaskCapture-0.1.0-arm64.apk "$ANDROID_HOME/build-tools/36.0.0/aapt" "$ANDROID_HOME/build-tools/36.0.0/apksigner" > distribution/verification.json
      python3 -m json.tool distribution/verification.json > /dev/null
      cd distribution
      sha256sum TaskCapture-0.1.0-arm64.apk > SHA256SUMS.txt
   - name: Test actual model on ten Russian inputs
     working-directory: taskcapture-android
     run: |
      cmake -S app/src/main/cpp -B host-build -DCMAKE_BUILD_TYPE=Release
      cmake --build host-build -j2 --target taskcapture-host taskcapture-deadline-test
      host-build/taskcapture-deadline-test
      python3 scripts/check-inference.py host-build/taskcapture-host app/src/main/assets/model.gguf
   - uses: actions/upload-artifact@v4
     with:
      name: TaskCapture-Android-APK
      compression-level: 0
      retention-days: 30
      if-no-files-found: error
      path: |
       taskcapture-android/distribution/*
       taskcapture-android/inference-report.json
       taskcapture-android/app/build/reports/tests
 emulator:
  runs-on: ubuntu-latest
  timeout-minutes: 45
  steps:
   - uses: actions/checkout@v5
   - uses: actions/setup-java@v5
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
     with:
      packages: platform-tools
      log-accepted-android-sdk-licenses: false
   - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
   - name: Check committed build files
     run: python3 taskcapture-android/scripts/test-build-files.py
   - name: Prepare pinned local model and runtime
     run: python3 scripts/prepare-dependencies.py
     working-directory: taskcapture-android
   - name: Build Android test APKs
     run: ./gradlew --no-daemon --max-workers=2 assembleDebug assembleDebugAndroidTest -PtestAbi=x86_64
     working-directory: taskcapture-android
   - name: Check optimized inference kernels
     run: python3 taskcapture-android/scripts/check-native-flags.py
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 35
      target: google_apis
      arch: x86_64
      profile: pixel_2
      disable-animations: true
      emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096 -camera-back none
      script: cd taskcapture-android && bash scripts/emulator-check.sh
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: TaskCapture-Android-Checks
      path: |
       taskcapture-android/app/build/reports/androidTests
       taskcapture-android/app/build/outputs/androidTest-results
       taskcapture-android/emulator-ui.xml
 publish:
  needs: [apk, emulator]
  runs-on: ubuntu-latest
  permissions:
   contents: write
  steps:
   - uses: actions/download-artifact@v4
     with:
      name: TaskCapture-Android-APK
      path: release-artifact
   - name: Publish tested APK
     env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
     run: |
      tag="taskcapture-android-0.1.0-$GITHUB_RUN_ID"
      cat > release-notes.md <<'NOTES'
      TaskCapture Android — тестовая версия 0.1.0.
      Выделите текст → «Создать задачу» → задача автоматически в локальном бэклоге.
      Альтернативный вход: «Поделиться» → TaskCapture.
      Модель Qwen3 0.6B встроена, интернет на телефоне не нужен.
      Android 8.0+, arm64-v8a. Нужен запас свободного места для APK и копии модели.
      В этой версии модель обрабатывает первые 600 символов; полный исходник сохранён.
      APK подписан тестовым ключом. Windows — следующим отдельным этапом.
      NOTES
      gh release create "$tag" release-artifact/distribution/TaskCapture-0.1.0-arm64.apk release-artifact/distribution/SHA256SUMS.txt --repo "$GH_REPO" --target "$GITHUB_SHA" --prerelease --title "TaskCapture Android 0.1.0" --notes-file release-notes.md
