name: TaskCapture Android
on:
 push:
  branches: [feat/taskcapture-android]
  paths: ['taskcapture-android/**', '.github/workflows/taskcapture-android.yml']
 workflow_dispatch:
permissions:
 contents: read
jobs:
 test:
  runs-on: ubuntu-latest
  timeout-minutes: 30
  steps:
   - uses: actions/checkout@v5
   - uses: actions/setup-java@v5
     with:
      distribution: temurin
      java-version: '17'
   - uses: android-actions/setup-android@v3
   - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
   - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest -PtestAbi=x86_64
     working-directory: taskcapture-android
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 35
      target: google_apis
      arch: x86_64
      profile: pixel_2
      disable-animations: true
      script: cd taskcapture-android && ./gradlew --no-daemon connectedDebugAndroidTest -PtestAbi=x86_64
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: taskcapture-tests
      path: taskcapture-android/app/build/reports
