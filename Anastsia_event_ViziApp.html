<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Анна Соколова — Premium Event Manager</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-color: #030303;
            --surface-color: rgba(20, 20, 20, 0.4);
            --surface-border: rgba(229, 193, 88, 0.15);
            --accent-color: #E5C158;
            --accent-glow: rgba(229, 193, 88, 0.35);
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --font-main: 'Montserrat', sans-serif;
            --curtain-bg: #070707;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        /* --- BACKGROUND --- */
        .ambient-light {
            position: fixed;
            top: 10%;
            left: 50%;
            width: 80vw;
            height: 80vw;
            max-width: 500px;
            max-height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
            animation: breathe 8s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.7; }
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
            z-index: 1;
        }

        /* --- HEADER --- */
        .header {
            padding: 60px 24px 40px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .avatar-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-color), transparent, var(--accent-color));
            animation: spinBg 10s linear infinite;
        }

        @keyframes spinBg {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.9);
            /* Компенсация вращения родителя, чтобы текст/фото не крутилось */
            animation: spinBgReverse 10s linear infinite;
        }

        @keyframes spinBgReverse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            background: linear-gradient(to right, #fff, #bbb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 11px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .desc {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.7;
            font-weight: 300;
            max-width: 320px;
            margin: 0 auto;
        }

        /* --- CONTENT AREA --- */
        .content-area {
            position: relative;
            padding-bottom: 100px;
            min-height: 600px;
        }

        .section {
            padding: 30px 24px;
            opacity: 0.95;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .section-header span {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--text-main);
            font-weight: 500;
        }

        .section-header::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--surface-border), transparent);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stat-card {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px 16px;
            border-radius: 20px;
            border: 1px solid var(--surface-border);
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s ease;
        }

        .stat-card h3 {
            font-size: 32px;
            color: var(--accent-color);
            font-weight: 300;
            margin-bottom: 4px;
            text-shadow: 0 0 15px rgba(229, 193, 88, 0.2);
        }

        .stat-card p {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        /* Video */
        .video-box {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 20px;
            background: #000;
            border: 1px solid var(--surface-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .video-box::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(255,255,255,0.05) 0%, transparent 70%);
        }

        .play-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(229, 193, 88, 0.15);
            border: 1px solid var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            backdrop-filter: blur(8px);
            cursor: pointer;
            box-shadow: 0 0 30px var(--accent-glow);
            transition: all 0.3s ease;
        }

        .play-btn:active { transform: scale(0.9); }

        /* Buttons */
        .btn-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            border: 1px solid var(--surface-border);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(229, 193, 88, 0.1), transparent);
            transition: left 0.5s ease;
        }

        .btn:active {
            transform: scale(0.97);
            border-color: var(--accent-color);
        }

        .btn:active::before { left: 100%; }

        /* --- THE CURTAIN & MECHANICS --- */
        .curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(7,7,7,0.95) 0%, var(--curtain-bg) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 50;
            /* Spring physics transition for the drop */
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
            border-top: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 -30px 60px rgba(0,0,0,0.9), 0 -2px 10px var(--accent-glow);
        }

        /* Светящийся трос */
        .rope {
            position: absolute;
            top: -100vh;
            left: 55px;
            width: 2px;
            height: 100vh;
            background: linear-gradient(180deg, transparent, var(--accent-color));
            box-shadow: 0 0 10px var(--accent-color);
        }

        /* Человечек (Агент) */
        .agent-hanging {
            position: absolute;
            top: -5px;
            left: 36px;
            width: 40px;
            height: 60px;
            filter: drop-shadow(0 0 4px rgba(229, 193, 88, 0.4));
        }

        .agent-svg {
            width: 100%;
            height: 100%;
            stroke: var(--accent-color);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* Анимация рук при натяжении */
        .arm { transition: all 0.2s ease; }
        .pulling .arm-left { transform: translateY(4px) rotate(-10deg); transform-origin: center; }
        .pulling .arm-right { transform: translateY(4px) rotate(10deg); transform-origin: center; }
        .pulling .agent-body { transform: translateY(2px); }

        /* Диалоговое окно */
        .bubble {
            position: absolute;
            bottom: 75px;
            left: -10px;
            background: #1a1a1a;
            border: 1px solid var(--surface-border);
            color: #fff;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            letter-spacing: 0.5px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            transition: opacity 0.3s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom left;
        }

        .bubble::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 35px;
            width: 10px;
            height: 10px;
            background: #1a1a1a;
            border-right: 1px solid var(--surface-border);
            border-bottom: 1px solid var(--surface-border);
            transform: rotate(45deg);
        }

        .bubble.hidden {
            opacity: 0;
            transform: scale(0.8) translateY(10px);
        }

        /* --- FINAL SCENE --- */
        .finale {
            margin-top: 40px;
            height: 120px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s;
        }

        .finale.show {
            opacity: 1;
            transform: translateY(0);
        }

        .agent-standing {
            width: 50px;
            height: 75px;
            margin-right: 20px;
            filter: drop-shadow(0 0 5px rgba(229, 193, 88, 0.5));
        }

        .finale-text {
            color: var(--accent-color);
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 30px;
            border-right: 2px solid var(--accent-color);
            white-space: nowrap;
            overflow: hidden;
            width: 0;
        }

        .finale.show .finale-text {
            animation: typing 1s steps(10) forwards 0.8s, blink 0.7s infinite alternate;
        }

        @keyframes typing { to { width: 105px; } }
        @keyframes blink { 50% { border-color: transparent; } }

        /* --- PARTICLES --- */
        .particle {
            position: fixed;
            border-radius: 50%;
            background: var(--accent-color);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 10px var(--accent-color);
            animation: particle-fly 0.6s cubic-bezier(0, .9, .57, 1) forwards;
        }

        @keyframes particle-fly {
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="ambient-light"></div>

<div class="container">
    <header class="header">
        <div class="avatar-wrap">
            <div class="avatar">AS</div>
        </div>
        <h1>Анна Соколова</h1>
        <p class="subtitle">Premium Event Management</p>
        <p class="desc">Безупречная организация событий. Тонкая настройка эмоций и абсолютный контроль хаоса.</p>
    </header>

    <div class="content-area" id="contentArea">
        
        <div class="content-wrapper">
            <div class="section stat-section">
                <div class="section-header"><span>Аналитика</span></div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3 data-target="150">0</h3>
                        <p>Событий</p>
                    </div>
                    <div class="stat-card">
                        <h3 data-target="8">0</h3>
                        <p>Лет опыта</p>
                    </div>
                    <div class="stat-card">
                        <h3 data-target="10">0</h3>
                        <p>Топ агентств</p>
                    </div>
                    <div class="stat-card">
                        <h3 data-target="24" data-suffix="/7">0</h3>
                        <p>Контроль</p>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header"><span>Визуализация</span></div>
                <div class="video-box">
                    <div class="play-btn">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor" style="margin-left: 4px;">
                            <path d="M7 6v12l11-6z"/>
                        </svg>
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header"><span>Доступ</span></div>
                <div class="btn-stack">
                    <a href="#" class="btn">Написать в Telegram</a>
                    <a href="#" class="btn">Прямой звонок</a>
                    <a href="#" class="btn">Скачать райдер</a>
                </div>

                <div class="finale" id="finale">
                    <div class="agent-standing">
                        <svg viewBox="0 0 50 75" class="agent-svg">
                            <circle cx="25" cy="12" r="6"/>
                            <line x1="25" y1="18" x2="25" y2="45"/>
                            <polyline points="25,45 15,70"/>
                            <polyline points="25,45 35,70"/>
                            <polyline points="25,22 15,35 22,42"/>
                            <polyline points="25,22 35,35 28,42"/>
                        </svg>
                    </div>
                    <div class="finale-text">Твой ход.</div>
                </div>
            </div>
        </div>

        <div class="curtain" id="curtain">
            <div class="rope"></div>
            <div class="agent-hanging" id="agent">
                <div class="bubble" id="bubble">Тяни вниз! 👇</div>
                <svg viewBox="0 0 40 60" class="agent-svg agent-body">
                    <path class="arm arm-left" d="M20,20 L12,5 L18,0" />
                    <path class="arm arm-right" d="M20,20 L28,5 L22,0" />
                    <circle cx="20" cy="16" r="5" />
                    <line x1="20" y1="21" x2="20" y2="42" />
                    <polyline points="20,42 14,58" />
                    <polyline points="20,42 26,58" />
                </svg>
            </div>
        </div>

    </div>
</div>

<script>
    const curtain = document.getElementById('curtain');
    const agent = document.getElementById('agent');
    const bubble = document.getElementById('bubble');
    const finale = document.getElementById('finale');
    const contentArea = document.getElementById('contentArea');
    
    const TOTAL_TAPS = 4;
    let currentTap = 0;
    let isAnimating = false;
    let statsAnimated = false;

    const phrases = [
        "Тяни вниз! 👇",
        "Механизм запущен ⚙️",
        "Уже половина... 🎬",
        "Финальное усилие! ⚡",
        ""
    ];

    // Система частиц (Искры)
    function spawnParticles(x, y, amount = 8) {
        for (let i = 0; i < amount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Рандомный размер и разлет
            const size = Math.random() * 4 + 2;
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 60 + 40;
            const dx = Math.cos(angle) * velocity;
            const dy = Math.sin(angle) * velocity;

            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            particle.style.setProperty('--dx', `${dx}px`);
            particle.style.setProperty('--dy', `${dy}px`);

            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 600);
        }
    }

    // Анимация чисел
    function animateStats() {
        if(statsAnimated) return;
        statsAnimated = true;
        const counters = document.querySelectorAll('h3[data-target]');
        
        counters.forEach(counter => {
            const target = +counter.getAttribute('data-target');
            const suffix = counter.getAttribute('data-suffix') || '';
            const isPlus = target > 50; // для "150+"
            const duration = 1500;
            const stepTime = Math.abs(Math.floor(duration / target));
            let current = 0;
            
            const timer = setInterval(() => {
                current += Math.ceil(target / 30);
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                    counter.innerText = current + (isPlus ? "+" : "") + suffix;
                } else {
                    counter.innerText = current;
                }
            }, stepTime);
        });
    }

    // Обработка тапа/клика
    function handleAction(e) {
        if (currentTap >= TOTAL_TAPS || isAnimating) return;
         
        isAnimating = true;  
        currentTap++;
        
        // Позиция для партиклов 
        const clientX = e.clientX || (e.touches && e.touches[0].clientX); 
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);  
        spawnParticles(clientX, clientY, 15); 

        // Расчет позиции шторки
        const containerHeight = contentArea.offsetHeight; 
        // Опускаем шторку на % от высоты
        const step = containerHeight / TOTAL_TAPS;
        const targetY = currentTap * step; 

        // Анимация человечка (Натяжение) 
        agent.classList.add('pulling');
        
        // Меняем фразу с эффектом 
        bubble.classList.add('hidden'); 
        setTimeout(() => {
            if (phrases[currentTap]) {
                bubble.innerText = phrases[currentTap];
                bubble.classList.remove('hidden');
            }
        }, 300);

        // Двигаем шторку
        curtain.style.transform = `translateY(${targetY}px)`;
        
        // Если шторка открыла статистику
        if (currentTap === 2) {
            setTimeout(animateStats, 300);
        }

        setTimeout(() => {
            agent.classList.remove('pulling');
            isAnimating = false;
            
            // Финал
            if (currentTap === TOTAL_TAPS) {
                // Прячем шторку окончательно
                curtain.style.opacity = '0';
                curtain.style.pointerEvents = 'none';
                bubble.style.display = 'none';
                
                // Взрыв искр снизу
                spawnParticles(window.innerWidth / 2, window.innerHeight - 50, 40);

                setTimeout(() => {
                    finale.classList.add('show');
                }, 400);
            }
        }, 800); // Синхронизировано с transition шторки
    }

    // Слушатели событий
    document.addEventListener('touchstart', (e) => {
        // Проверяем, не кликнули ли по активным кнопкам или видео
        if(currentTap >= TOTAL_TAPS && e.target.closest('a, .play-btn')) return;
        // Иначе продолжаем механику
        if(currentTap < TOTAL_TAPS) {
            e.preventDefault();
            handleAction(e);
        }
    }, {passive: false});

    document.addEventListener('mousedown', (e) => {
        if(currentTap >= TOTAL_TAPS && e.target.closest('a, .play-btn')) return;
        if(currentTap < TOTAL_TAPS) handleAction(e);
    });

</script>

</body>
</html>
