<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Анна Соколова — Premium Event Manager</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-color: #030303;
            --surface-color: rgba(20, 20, 20, 0.4);
            --surface-border: rgba(229, 193, 88, 0.15);
            --accent-color: #E5C158;
            --accent-glow: rgba(229, 193, 88, 0.35);
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --font-main: 'Montserrat', sans-serif;
            --curtain-bg: #070707;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            overscroll-behavior-y: none;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        /* --- HEADER (Слой 10) --- */
        .header {
            padding: 60px 24px 40px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .avatar-wrap {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, var(--accent-color), transparent, var(--accent-color));
            animation: spinBg 10s linear infinite;
        }

        @keyframes spinBg { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .avatar {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: #0a0a0a;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-color); font-size: 12px; font-weight: 600;
            text-transform: uppercase;
            animation: spinBgReverse 10s linear infinite;
        }

        @keyframes spinBgReverse { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }

        /* --- INTERACTIVE LAYER (Слой 100+) --- */
        /* Эти элементы летают над хедером */
        .rope {
            position: absolute;
            top: 0;
            left: 75px;
            width: 2px;
            height: 100vh; /* Очень длинный трос */
            background: linear-gradient(180deg, transparent, var(--accent-color));
            box-shadow: 0 0 10px var(--accent-color);
            z-index: 100;
            pointer-events: none;
            transform: translateY(-100%); /* Прячем основную часть выше */
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }

        .agent-hanging {
            position: absolute;
            top: 0;
            left: 55px;
            width: 40px;
            height: 60px;
            z-index: 101;
            pointer-events: none;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
        }

        .bubble {
            position: absolute;
            bottom: 75px;
            left: -10px;
            background: #1a1a1a;
            border: 1px solid var(--surface-border);
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 13px;
            white-space: nowrap;
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            z-index: 102;
            transition: opacity 0.3s, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .bubble::after {
            content: ''; position: absolute; bottom: -6px; left: 35px;
            width: 10px; height: 10px; background: #1a1a1a; 
            border-right: 1px solid var(--surface-border);
            border-bottom: 1px solid var(--surface-border);
            transform: rotate(45deg);
        }

        .bubble.hidden { opacity: 0; transform: scale(0.8) translateY(10px); }

        .agent-svg {
            width: 100%; height: 100%;
            stroke: var(--accent-color); stroke-width: 2.5;
            fill: none;
        }

        /* --- CONTENT & CURTAIN (Слой 5) --- */
        .content-area {
            position: relative;
            overflow: hidden; /* Обрезаем шторку снизу */
            z-index: 5;
            min-height: 500px;
        }

        .curtain {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    /* Полностью непрозрачный черный фон */
    background: #000000; 
    /* Если хочешь оставить легкий градиент для объема, используй это:
    background: linear-gradient(180deg, #000000 0%, #070707 100%); */
    
    z-index: 50;
    transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.6s ease;
    
    /* Тень сверху, чтобы отделять шторку от контента при движении */
    box-shadow: 0 -20px 50px rgba(0,0,0,1); 
}

        /* --- Стили контента (как в твоем оригинале) --- */
        .section { padding: 30px 24px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .stat-card { background: var(--surface-color); padding: 24px 16px; border-radius: 20px; border: 1px solid var(--surface-border); text-align: center; }
        .stat-card h3 { font-size: 32px; color: var(--accent-color); }
        .btn { display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--surface-color); border-radius: 16px; color: #fff; text-decoration: none; margin-bottom: 16px; border: 1px solid var(--surface-border); }

        .finale { opacity: 0; transform: translateY(-20px); transition: all 0.8s ease; text-align: center; margin-top: 20px; }
        .finale.show { opacity: 1; transform: translateY(0); }

        .particle { position: fixed; border-radius: 50%; background: var(--accent-color); pointer-events: none; z-index: 9999; animation: fly 0.6s forwards; }
        @keyframes fly { 100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div class="rope" id="rope"></div>
    <div class="agent-hanging" id="agent">
        <div class="bubble" id="bubble">Тяни вниз! 👇</div>
        <svg viewBox="0 0 40 60" class="agent-svg">
            <path class="arm-left" d="M20,20 L12,5 L18,0" />
            <path class="arm-right" d="M20,20 L28,5 L22,0" />
            <circle cx="20" cy="16" r="5" />
            <line x1="20" y1="21" x2="20" y2="42" />
            <polyline points="20,42 14,58" /> 
            <polyline points="20,42 26,58" />
        </svg> 
    </div>

    <header class="header">
        <div class="avatar-wrap"><div class="avatar">AS</div></div>
        <h1>Анна Соколова</h1> 
        <p style="color: var(--accent-color); letter-spacing: 4px; font-size: 11px; text-transform: uppercase;">Premium Event Management</p>
    </header>

    <div class="content-area" id="contentArea">
        <div class="curtain" id="curtain"></div>

        <div class="content-wrapper">
            <div class="section"> 
                <div class="stats-grid">
                    <div class="stat-card"><h3 data-target="150">0</h3><p>Событий</p></div>
                    <div class="stat-card"><h3 data-target="8">0</h3><p>Лет опыта</p></div>
                </div>
            </div>
            <div class="section">
                <div class="stats-grid">
                    <div class="stat-card"><h3 data-target="150">0</h3><p>Событий</p></div>
                    <div class="stat-card"><h3 data-target="8">0</h3><p>Лет опыта</p></div>
                </div>
            </div>
            <div class="section">
                <div class="stats-grid">
                    <div class="stat-card"><h3 data-target="150">0</h3><p>Событий</p></div>
                    <div class="stat-card"><h3 data-target="8">0</h3><p>Лет опыта</p></div>
                </div> 
            </div>
            <div class="section">
                <div class="stats-grid">
                    <div class="stat-card"><h3 data-target="150">0</h3><p>Событий</p></div>
                    <div class="stat-card"><h3 data-target="8">0</h3><p>Лет опыта</p></div>
                </div>
            </div>
            <div class="section">
                <div class="stats-grid">
                    <div class="stat-card"><h3 data-target="150">0</h3><p>Событий</p></div>
                    <div class="stat-card"><h3 data-target="8">0</h3><p>Лет опыта</p></div>
                </div>
            </div>
            <div class="section">
                <div class="stats-grid">
                    <div class="stat-card"><h3 data-target="150">0</h3><p>Событий</p></div>
                    <div class="stat-card"><h3 data-target="8">0</h3><p>Лет опыта</p></div>
                </div>
            </div>
            <div class="section">
                <a href="#" class="btn">Написать в Telegram</a>
                <a href="#" class="btn">Прямой звонок</a>
            </div>
            <div class="finale" id="finale">
                <h2 style="color: var(--accent-color)">Твой ход.</h2>
            </div>
        </div>
    </div>
</div>

<script>
    const curtain = document.getElementById('curtain');
    const agent = document.getElementById('agent');
    const rope = document.getElementById('rope');
    const bubble = document.getElementById('bubble');
    const contentArea = document.getElementById('contentArea');
    const finale = document.getElementById('finale');

    const TOTAL_TAPS = 4;
    let currentTap = 0;
    let isAnimating = false;

    const phrases = ["Тяни вниз! 👇", "Механизм запущен ⚙️", "Уже половина... 🎬", "Финальное усилие! ⚡"];

    function spawnParticles(x, y) {
        for (let i = 0; i < 10; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            const size = Math.random() * 4 + 2;
            p.style.width = p.style.height = `${size}px`;
            p.style.left = `${x}px`; p.style.top = `${y}px`;
            p.style.setProperty('--dx', `${(Math.random()-0.5)*100}px`);
            p.style.setProperty('--dy', `${(Math.random()-0.5)*100}px`); 
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 600); 
        }
    }
 
    function handleAction(e) { 
        if (currentTap >= TOTAL_TAPS || isAnimating) return;
        isAnimating = true;
        currentTap++;

        const x = e.clientX || (e.touches && e.touches[0].clientX);
        const y = e.clientY || (e.touches && e.touches[0].clientY);
        spawnParticles(x, y);

        // Расчет движения (основан на высоте контентной области)
        const areaHeight = contentArea.offsetHeight;
        const targetY = (currentTap / TOTAL_TAPS) * areaHeight;

        // 1. Двигаем шторку
        curtain.style.transform = `translateY(${targetY}px)`;
        
        // 2. Двигаем агента (синхронно)
        // Добавляем отступ хедера, чтобы он начинал движение оттуда
        const headerHeight = document.querySelector('.header').offsetHeight;
        agent.style.transform = `translateY(${headerHeight + targetY}px)`;

        // 3. Трос (растет из-за верхней границы до рук агента)
        rope.style.transform = `translateY(calc(-100% + ${headerHeight + targetY + 10}px))`;

        // Облачко
        bubble.classList.add('hidden');
        setTimeout(() => {
            if (phrases[currentTap]) {
                bubble.innerText = phrases[currentTap];
                bubble.classList.remove('hidden');
            }
        }, 300);

        setTimeout(() => {
            isAnimating = false;
            if (currentTap === TOTAL_TAPS) {
                [curtain, agent, rope].forEach(el => el.style.opacity = '0');
                finale.classList.add('show');
            }
        }, 800);
    }

    // Инициализация позиции агента (ставим его в начало контента)
    window.onload = () => {
        const headerHeight = document.querySelector('.header').offsetHeight;
        agent.style.transform = `translateY(${headerHeight}px)`;
        rope.style.transform = `translateY(calc(-100% + ${headerHeight + 10}px))`;
    };

    document.addEventListener('mousedown', handleAction);
    document.addEventListener('touchstart', (e) => {
        if(currentTap < TOTAL_TAPS) { e.preventDefault(); handleAction(e); }
    }, {passive: false});
</script>

</body>
</html>
