plugins { id 'com.android.application' }
android {
    namespace 'com.trinetzet.clientbridge'
    compileSdk 36
    defaultConfig {
        applicationId 'com.trinetzet.clientbridge'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/offline-assets')
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
def bundleWeb = tasks.register('bundleWeb', Sync) {
    from('../../clientbridge') { include 'index.html','styles.css','app.mjs','core.mjs','scenarios.mjs','extra-scenarios.mjs','practice.mjs' }
    from('src/main/offline') { include 'android-adapter.js' }
    into layout.buildDirectory.dir('generated/offline-assets/clientbridge')
    doLast {
        def index = layout.buildDirectory.file('generated/offline-assets/clientbridge/index.html').get().asFile
        index.text = index.getText('UTF-8').replace('<script type="module"', '<script src="./android-adapter.js"></script>\n  <script type="module"')
    }
}
tasks.named('preBuild').configure { dependsOn bundleWeb }
